# Pinned exactly: the DOCX comment writer (`export_docx_uc.rs`) patches raw XML bytes out of
# `Docx::build()`'s output for three fields docx-rs's public builder API cannot set
# (`w15:done`, `w:initials`, and a private-namespace uid attribute) — undocumented internal
# shape that a loose `"0.4"` could silently drift out from under on the next `cargo update`.
# A bump must be a deliberate `cargo update -p docx-rs --precise X.Y.Z` followed by re-reading
# the relevant docx-rs source under `~/.cargo/registry/src/*/docx-rs-X.Y.Z/` and re-running the
# raw-XML byte tests, never an incidental drift from a bare `cargo update`.
#
# ⚠ The exact version is NOT free to choose. Skribisto — the host app this writer exists for —
# *reads* DOCX with `docx-rs` too (`document_ingest`, which requires `0.4.22`), and both crates
# land in one dependency graph. Cargo unifies a single version across a semver-compatible range,
# so pinning this to `=0.4.21` while the reader asks for `^0.4.22` is unsatisfiable and breaks
# Skribisto's build outright — it did, which is how this note came to be written. Whatever this
# is pinned to must also satisfy every other `docx-rs` requirement in the tree.
#
# 0.4.22 is safe for the raw-XML patch above: `elements/comment.rs`, `elements/comment_extended.rs`
# and `elements/paragraph.rs` are byte-identical to 0.4.21, `xml_docx.rs` differs only in doc
# comments (`comments`/`comments_extended` are still `pub Vec<u8>`), and the auto-collector's
# `CommentExtended::new(para_id)` is unchanged — same call, same line. Verified by diffing the
# two extracted crate sources, not assumed.
docx-rs = "=0.4.22"
# A comment/reply body is Djot source (`common::parser_tools::DocumentComment::body`);
# `export_docx_uc.rs`'s `render_comment_body` walks it with the same pull parser `common`
# uses for the real Djot importer. Matched to `common`'s own `jotdown` version so the two
# never silently read the same source two different ways.
jotdown = { version = "0.10", default-features = false }
# DOCX embeds every image as PNG (docx-rs names every media part `.png`), so a
# JPEG has to be transcoded. Already in the tree via docx-rs's default `image`
# feature — naming it directly is what lets the conversion be fallible instead
# of going through `Pic::new`, which panics on a file it cannot decode.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
epub-builder = "0.8.3"
# The ODT writer's own zip container. Unlike DOCX (docx-rs) and EPUB (epub-builder), there is
# no maintained ODF-writing crate to lean on (`open-document` v0.1.0 is a single unstable
# release — not a dependency), so `export_odt_uc.rs` hand-assembles the OpenDocument package
# directly on top of this crate: `mimetype` stored uncompressed as the first entry (an ODF
# container requirement, mirrored from how `epub-builder` handles EPUB's identical rule),
# `META-INF/manifest.xml`, `content.xml`, `styles.xml`, deflated. Was a dev-dependency only
# (used by tests to unzip a packaged DOCX/EPUB for inspection); promoted to a real dependency
# because the ODT writer itself now needs it at runtime, not only in tests.
zip = "6"

