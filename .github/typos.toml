files.extend-exclude = [
  "CHANGELOG.md",
  "tests",
  "crates/cli/src/benchmark_seed.txt",
]
[default.extend-words]
# Acronyms
als = "als"
lits = "lits"
ths = "ths"
wrold = "wrold"
# EPUB Open Packaging Format (content.opf)
opf = "opf"
# OpenDocument Format
odf = "odf"
ODF = "ODF"
# Arabic letter names (teh marbuta) in Unicode folding tables
teh = "teh"
# "mis-" prefix in hyphenated compounds
mis = "mis"
# Sentence-splitter locale fixtures / abbreviation lists (not English typos)
oll = "oll"       # Irish: an t-oll
sur = "sur"       # Maltese honorific
elment = "elment" # Hungarian: left
sie = "sie"       # German: she / they
Sie = "Sie"       # German: formal you
vas = "vas"       # Spanish: you go
# Image format short codes
fo = "fo"